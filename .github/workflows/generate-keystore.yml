name: Generate signing key

# شغّله مرة واحدة فقط لإنشاء مفتاح التوقيع الدائم.
# يعمل في المستودعات الخاصة والعامة. في المستودع العام يمكن لأي حساب GitHub مسجّل الدخول تنزيل الـ Artifact
# خلال مدة بقائه (يوم واحد)، لذلك نزّله فورًا ثم احذفه من صفحة التشغيل (Delete artifact).
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'اسم المفتاح (Alias)'
        type: string
        default: 'gallery'
      common_name:
        description: 'الاسم الذي يظهر في الشهادة (CN)'
        type: string
        default: 'Gallery Studio'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Public repositories are allowed (the owner accepted the risk): only a warning is shown.
      - name: Warn when the repository is public
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::warning title=مستودع عام::المستودع عام، لذلك يستطيع أي حساب GitHub تنزيل الـ Artifact باسم signing-key خلال يوم واحد. نزّله فورًا ثم احذفه (Delete artifact) وأضف الأسرار."
          fi

      - name: Create the keystore
        env:
          ALIAS: ${{ inputs.alias }}
          CN: ${{ inputs.common_name }}
        run: |
          set -e
          mkdir -p out
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore out/release.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=$CN"
          {
            echo "STORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$PASS"
          } > out/signing-info.txt
          # ready-to-paste value of the KEYSTORE_BASE64 secret
          base64 -w0 out/release.jks > out/KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_BASE64=$(cat out/KEYSTORE_BASE64.txt)"
            echo "KEYSTORE_PASSWORD=$PASS"
          } >> out/signing-info.txt
          FP="$(keytool -list -v -keystore out/release.jks -alias "$ALIAS" -storepass "$PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//')"
          {
            echo "## 🔑 تم إنشاء مفتاح التوقيع"
            echo ""
            echo "**الصلاحية: 30 سنة (10950 يومًا).**"
            echo ""
            echo "**SHA-256 للشهادة:**"
            echo ""
            echo "\`$FP\`"
            echo ""
            echo "1. نزّل الـ Artifact باسم **signing-key** (ينتهي بعد يوم واحد)."
            echo "2. أضف أسرار المستودع: KEYSTORE_BASE64 (انسخ كل محتوى الملف KEYSTORE_BASE64.txt) و KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD — القيم الأخرى في signing-info.txt."
            echo "3. احتفظ بنسخة احتياطية من الملفين في مكان آمن ثم احذف الـ Artifact. فقدان المفتاح = لا يمكن تحديث التطبيق أبدًا."
            if [ "${{ github.event.repository.private }}" != "true" ]; then
              echo ""
              echo "⚠️ **المستودع عام:** الـ Artifact قابل للتنزيل من أي حساب GitHub حتى تحذفه. نزّله الآن واحذفه فورًا."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 1
          if-no-files-found: error
